<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mama Care – Download</title>
  <style>
    :root {
      --bg: #fdf6f8;
      --card: #ffffff;
      --text: #2b2230;
      --muted: #6e6274;
      --accent: #d6457a;
      --accent-text: #ffffff;
      --border: #f0dde5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1620;
        --card: #261f2c;
        --text: #f3eaf1;
        --muted: #b3a6b8;
        --accent: #f06d9c;
        --accent-text: #1b1620;
        --border: #3a2f40;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    .logo { font-size: 56px; line-height: 1; }
    h1 { margin: 12px 0 4px; font-size: 28px; }
    .tagline { margin: 0 0 24px; color: var(--muted); }
    .download {
      display: block;
      padding: 16px;
      border-radius: 14px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
    }
    .download:hover { filter: brightness(1.05); }
    .meta { margin: 10px 0 28px; font-size: 14px; color: var(--muted); }
    h2 { font-size: 16px; text-align: left; margin: 0 0 8px; }
    ol { text-align: left; margin: 0; padding-left: 20px; color: var(--muted); font-size: 15px; }
    li + li { margin-top: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🤱</div>
    <h1>Mama Care</h1>
    <p class="tagline">Android app</p>

    <a class="download" href="mama_care.apk" download>Download for Android</a>
    <p class="meta">APK · 68 MB</p>

    <h2>How to install</h2>
    <ol>
      <li>Tap <strong>Download for Android</strong> and open the file when it finishes.</li>
      <li>If asked, allow your browser to <strong>install unknown apps</strong>.</li>
      <li>If Play Protect warns about an unknown developer, tap <strong>More details → Install anyway</strong>.</li>
    </ol>
  </main>
</body>
</html>
